<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="plyml — a small site in progress." />
  <meta name="color-scheme" content="light dark" />
  <title>plyml</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1020;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-soft: #1e3a8a;
        --border: #1f2937;
        --shadow: 0 10px 30px rgba(0, 0, 0, .4);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(1200px 600px at 10% -10%, var(--accent-soft), transparent 60%),
        var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: clamp(1.25rem, 4vw, 2.25rem);
    }
    .badge {
      display: inline-block;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: .25rem .6rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(2rem, 6vw, 2.5rem);
      letter-spacing: -.02em;
      line-height: 1.1;
    }
    .lead { margin: 0 0 1.5rem; color: var(--muted); }
    ul.links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
    ul.links li { border-bottom: 1px solid var(--border); }
    ul.links a, ul.links span {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: .9rem .25rem;
      color: var(--text);
    }
    ul.links a { text-decoration: none; transition: color .15s, padding-left .15s; }
    ul.links a:hover, ul.links a:focus-visible { color: var(--accent); padding-left: .5rem; outline: none; }
    ul.links .label { font-weight: 600; }
    ul.links .hint { color: var(--muted); font-size: .9rem; }
    ul.links .arrow { color: var(--accent); }
    .footer { margin-top: 1.5rem; font-size: .85rem; color: var(--muted); }
    @media (max-width: 480px) {
      body { place-items: start center; padding-top: 2rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Work in progress</span>
    <h1>plyml</h1>
    <p class="lead">Hello 👋 — I’m still building this. Check back soon.</p>
    <ul class="links">
      <li><span><span class="label">Sporty</span><span class="hint">coming soon</span></span></li>
      <li><a href="mailto:eliaslaurawiegandt@gmail.com"><span class="label">Contact</span><span class="arrow">eliaslaurawiegandt@gmail.com →</span></a></li>
    </ul>
  </main>
</body>
</html>
